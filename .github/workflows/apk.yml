name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apk/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受许可并安装 SDK 组件
        run: |
          (yes | sdkmanager --licenses) > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 构建 APK
        run: gradle -p apk assembleDebug --no-daemon

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: hrt-tracker-apk
          path: apk/app/build/outputs/apk/debug/app-debug.apk

      - name: 发布到 Releases（公开下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.4.0
          name: HRT Tracker Android 安装包
          body: |
            调试签名的安装包。安装时允许「未知来源/安装未知应用」即可。
            更新版本请先卸载旧版再安装。
          files: apk/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
