name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apk/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 接受许可并补齐 SDK 组件（用 runner 预装 SDK）
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          (yes | sdkmanager --licenses) > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 构建 APK
        run: gradle -p apk assembleDebug --no-daemon

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: hrt-tracker-apk
          path: apk/app/build/outputs/apk/debug/app-debug.apk

      - name: 发布到 Releases（公开下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.5.2
          name: 碎碎念 Android 安装包
          body: |
            1.5.2 更新：
            1. 修复 HRT 血药浓度图表：注射后曲线不再出现异常尖峰，与模型一致（平滑单峰 + 渐变面积填充 + 双 Y 轴 + 注射日标记 + 1W/1M 视图切换）。
            2. 日记新增「收纳」功能：可创建收纳夹分类整理日记，支持按收纳夹筛选和关键词搜索。
            调试签名的安装包，安装时允许「未知来源/安装未知应用」。
            更新请先卸载旧版再安装（数据不受影响）。
          files: apk/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
