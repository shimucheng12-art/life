name: Android APK（手动构建）

# v1.5.4 起改为纯手动触发：正式发布使用本地稳定密钥签名（apk/build-manual.sh），
# CI 的调试签名包仅供构建验证，不再自动发到 Releases（避免覆盖正式资产）。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 接受许可并补齐 SDK 组件（用 runner 预装 SDK）
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          (yes | sdkmanager --licenses) > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 构建 APK（调试签名，仅验证可编译）
        run: gradle -p apk assembleDebug --no-daemon

      - name: 上传构建产物（Artifact，不发Release）
        uses: actions/upload-artifact@v4
        with:
          name: hrt-tracker-debug-apk
          path: apk/app/build/outputs/apk/debug/app-debug.apk
