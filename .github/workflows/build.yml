name: Build and Deploy
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build project
        # GitHub Pages 项目页挂在 /life/ 子路径下，必须显式指定 base，
        # 否则产物引用 /assets/... 根绝对路径会 404（白屏）。
        run: npm run build -- --base=/life/
      - name: 校验产物引用路径
        run: |
          echo "--- index.html 资源引用 ---"
          grep -oE '(src|href)="[^"]+"' dist/index.html || true
          if grep -qE '="/(assets|favicon)' dist/index.html; then
            echo "仍存在根绝对路径引用"; exit 1
          fi
          echo "路径检查通过"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
