plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smirnovayama.hrttracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.smirnovayama.hrttracker"
        minSdk 29
        targetSdk 34
        versionCode 9
        versionName "2.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
