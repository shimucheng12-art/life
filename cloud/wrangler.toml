name = "life-diary-api"
main = "worker.ts"
compatibility_date = "2025-12-04"

# D1 数据库：首次部署前先执行
#   npx wrangler d1 create life-diary-db
# 再把返回的 database_id 填到下面
[[d1_databases]]
binding = "DB"
database_name = "life-diary-db"
database_id = "PLACEHOLDER_FILL_AFTER_D1_CREATE"

# 必需密钥（绝不写入仓库，用 wrangler secret 注入）：
#   JWT_SECRET               随机 ≥32 字符，用于签发登录令牌
#   ALIYUN_ACCESS_KEY_ID     阿里云 AccessKey（账号需已开通「号码认证服务」）
#   ALIYUN_ACCESS_KEY_SECRET 阿里云 AccessKey Secret
# 短信走阿里云「短信认证」服务：免资质/免签名/免模板，平台系统签名发送，
# 验证码由平台生成并在平台侧校验（SendSmsVerifyCode / CheckSmsVerifyCode）。

[observability]
enabled = true
